<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="THE BLUE WARDROBE is a luxury fashion brand showcasing premium global fabrics, exclusive collections, and elegant modern designs." />
    <meta property="og:title" content="THE BLUE WARDROBE" />
    <meta property="og:description" content="Luxury fashion collections crafted from rare and premium fabrics sourced around the world." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" />
    <title>THE BLUE WARDROBE</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
